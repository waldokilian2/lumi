[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi"
version = "0.1.0"
description = "Lumi — driver library + GUI/CLI for rev C USB-CDC round LCD panels (2.1\")"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Lumi" }]
dependencies = [
    "pyserial>=3.5",
    "pillow>=9.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
sensors = ["psutil>=5.9"]

[project.scripts]
lumi = "lumi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumi = ["lcd/*.py"]
